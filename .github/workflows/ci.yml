name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # `npm run build` regenerates the README help tables from the live CLI.
      # If that leaves the tree dirty, the committed README is stale — catch it
      # here rather than shipping mismatched docs to npm.
      - name: README help tables are up to date
        run: |
          npm run build
          if ! git diff --quiet -- README.md; then
            echo "README.md is stale — run 'npm run build' and commit the result." >&2
            git diff -- README.md >&2
            exit 1
          fi
